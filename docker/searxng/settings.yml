# SearXNG settings for the bundled DeerFlow search service.
#
# Merged on top of SearXNG's defaults (use_default_settings). Two deltas make
# the instance work with DeerFlow's web_search provider out of the box:
#
#   1. search.formats must include "json" — DeerFlow's SearXNG client calls
#      /search?format=json, which a stock instance rejects with HTTP 403.
#   2. server.limiter stays off — the bot-detection limiter would rate-limit
#      DeerFlow's client (it identifies itself with a bot User-Agent). This is
#      safe for an in-network instance that is not published to the internet.
#
# The secret key is injected via the SEARXNG_SECRET environment variable in
# docker-compose (SearXNG refuses to start with the built-in placeholder).
# Full reference: https://docs.searxng.org/admin/settings/index.html

use_default_settings: true

server:
  limiter: false
  image_proxy: false

search:
  formats:
    - html
    - json

# 3. A blocked engine must degrade the search, not zero it out.
#
# SearXNG's stock default mix leans on Google CSE, DuckDuckGo, Brave and
# Startpage. All four CAPTCHA or block shared and datacenter IP ranges
# aggressively — which is every commercial VPN exit, and a VPN is the normal
# shape for a privacy-motivated self-hosted stack. When they all fail at once
# SearXNG still answers HTTP 200, with an empty `results` array, and benches
# each blocked engine for ~180 seconds; the agent re-queries into the
# suspension and extends it. (The client now raises on that state instead of
# reporting an empty success — see SearxngEnginesUnavailableError.)
#
# Enabling engines that tolerate datacenter exits means a blocked consumer
# engine costs some results rather than all of them. These are on by name so
# the mix is explicit and reviewable; `use_default_settings: true` above keeps
# everything else SearXNG ships.
#
# Verified against SearXNG's own searx/settings.yml: all three carry
# `disabled: true` upstream (so this genuinely turns them on), while
# duckduckgo, brave and startpage are enabled by default (so they are the mix
# that fails on a VPN). Engine names must exist in that file or SearXNG
# refuses to start, which is why they are checked rather than guessed.
engines:
  - name: mojeek
    disabled: false
  - name: qwant
    disabled: false
  - name: bing
    disabled: false
