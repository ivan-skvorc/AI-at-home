repos:
  # Backend: ruff lint + format via uv (uses the same ruff version as backend deps)
  - repo: local
    hooks:
      - id: ruff
        name: ruff lint
        entry: bash -c 'cd backend && uv run ruff check --fix "${@/#backend\//}"' --
        language: system
        types_or: [python]
        files: ^backend/
      - id: ruff-format
        name: ruff format
        entry: bash -c 'cd backend && uv run ruff format "${@/#backend\//}"' --
        language: system
        types_or: [python]
        files: ^backend/
      - id: uv-lock-check
        name: uv lock check
        entry: bash -c 'cd backend && uv lock --check'
        language: system
        pass_filenames: false
        files: ^backend/(pyproject\.toml|uv\.lock|packages/harness/pyproject\.toml)$

  # Guidance budgets: any AGENTS.md edit re-checks EVERY chain, not just its own.
  # A file's own size is the small half of the rule — the checker's error is on
  # the *effective chain* a nested guide inherits, so a few paragraphs added to
  # the root AGENTS.md can push an unrelated module's chain over the hard limit
  # and fail `agent-guidance` (and `test_agent_guidance_check.py`) on a change
  # that never touched that module. Running the repo-wide check here is what
  # keeps that from being discovered in CI. Exits 1 on errors only; warnings
  # (the soft budgets) do not block a commit.
  - repo: local
    hooks:
      - id: agent-guidance
        name: agent guidance budgets
        entry: python3 scripts/check_agent_guidance.py
        language: system
        pass_filenames: false
        files: (^|/)AGENTS\.md$

  # Frontend: eslint + prettier (must run from frontend/ for node_modules resolution)
  - repo: local
    hooks:
      - id: frontend-eslint
        name: eslint (frontend)
        entry: bash -c 'cd frontend && npx eslint --fix "${@/#frontend\//}"' --
        language: system
        types_or: [javascript, tsx, ts]
        files: ^frontend/

      # No type allowlist on purpose. CI runs `prettier --check .` over the WHOLE
      # of frontend/, so anything prettier has a parser for is checked there —
      # Markdown included, and `frontend/src/AGENTS.md` is the file most likely to
      # be edited by someone who only thinks of prettier as a code formatter. A
      # hand-maintained `types_or` is a second, narrower list that has to be kept
      # equal to "whatever prettier supports" by memory; it drifted once already
      # and the drift is invisible locally (the hook passes, CI fails on a file it
      # never looked at). `--ignore-unknown` makes the list unnecessary: prettier
      # skips what it cannot parse, and `.prettierignore` still applies to the
      # explicit paths pre-commit hands it, so the hook and the CI job cover
      # exactly the same set.
      - id: frontend-prettier
        name: prettier (frontend)
        entry: bash -c 'cd frontend && npx prettier --write --ignore-unknown "${@/#frontend\//}"' --
        language: system
        files: ^frontend/
