[project]
name = "deerflow-extension-cad"
version = "0.1.0"
description = "A CAD module for DeerFlow that builds a part from a CadQuery script without running the script"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "deerflow-extension-api>=0.2.13,<0.3",
    # The kernel. Pinned: the allow-list is checked against this release's signatures.
    "cadquery==2.8.0",
    # The picture (render.py) and the print block (printability.py). Both arrive with the kernel
    # today (numpy through cadquery, Pillow through vtk and matplotlib); stated so a kernel release
    # that drops them cannot take them away. Pillow 10.1 is the first with a sized built-in font.
    "numpy>=2,<3",
    "pillow>=10.1,<14",
]

[project.entry-points."deerflow.extensions"]
cad = "deerflow_extension_cad:install"

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deerflow_extension_cad"]

[tool.uv]
# Rebuild the installed copy when any packaged file changes, not only
# pyproject.toml (uv's default): DeerFlow bundles this extension as a snapshot
# that `git pull` updates in place, and a stale build would keep old code.
cache-keys = [{ file = "pyproject.toml" }, { file = "deerflow_extension_cad/**/*" }]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 240
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["deerflow_extension_cad"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
