# Weekly drift audit for the bundled model roster (fork feature, roadmap item 4).
#
# FORK.md concedes that the existing tests "do not catch a stale-but-well-formed
# price or a since-renamed slug, because both pass against any syntactically
# valid entry", and names the failure: an expired promo leaves the chat header
# advertising a discount nobody is getting. This job is what notices.
#
# Two rules it must keep:
#   1. It never commits a price. FORK.md's audit rules require reading the price
#      off the provider's own page; a wrong automated price is worse than a stale
#      one, because it is wrong with confidence and silences the next audit.
#   2. An unreachable provider is a skip, never a failure. A weekly red job is a
#      job people learn to ignore, which would cost more than the drift.
name: Model Audit

on:
  schedule:
    # Mondays 06:17 UTC — off the hour so it does not queue behind everything
    # else scheduled at :00.
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      use_stale_fixture:
        description: "Run against the deliberately stale fixture instead of live catalogs (proves the audit still detects drift)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: model-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Self-test: the committed stale fixture must still produce findings. If
      # this stops reporting drift, the audit has broken and every clean live
      # run below would be a false all-clear.
      - name: Verify the audit still detects drift
        run: |
          python3 scripts/audit_models.py \
            --catalog scripts/fixtures/model_audit_stale_catalog.json \
            --output /tmp/self-test.md
          grep -q '```diff' /tmp/self-test.md
          grep -q 'Retired or renamed slugs' /tmp/self-test.md

      - name: Run the audit
        id: audit
        run: |
          if [ "${{ inputs.use_stale_fixture }}" = "true" ]; then
            python3 scripts/audit_models.py --catalog scripts/fixtures/model_audit_stale_catalog.json --output /tmp/report.md
          else
            python3 scripts/audit_models.py --output /tmp/report.md
          fi
          python3 scripts/audit_models.py \
            $([ "${{ inputs.use_stale_fixture }}" = "true" ] && echo "--catalog scripts/fixtures/model_audit_stale_catalog.json") \
            --format json --output /tmp/report.json
          count=$(python3 -c "import json;print(len(json.load(open('/tmp/report.json'))['findings']))")
          echo "findings=$count" >> "$GITHUB_OUTPUT"
          echo "Found $count finding(s)."

      # Reuse one issue rather than opening a new one every week: drift is a
      # standing condition, not an event, and a pile of near-identical issues is
      # how a useful signal becomes noise.
      - name: Open or update the audit issue
        if: steps.audit.outputs.findings != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Model & pricing audit: ${{ steps.audit.outputs.findings }} finding(s)"
          {
            cat /tmp/report.md
            echo
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code) — \`.github/workflows/model-audit.yml\`, run [\`${GITHUB_RUN_ID}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})._"
          } > /tmp/issue-body.md

          existing=$(gh issue list --state open --label model-audit --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --title "$title" --body-file /tmp/issue-body.md
            echo "Updated issue #$existing"
          else
            gh label create model-audit --description "Automated bundled-model / pricing drift audit" --color 0E8A16 --force || true
            gh issue create --title "$title" --body-file /tmp/issue-body.md --label model-audit
          fi

      # A previously-open issue whose drift has been resolved should close
      # itself, or the label stops meaning "something needs doing".
      - name: Close the audit issue when clean
        if: steps.audit.outputs.findings == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --state open --label model-audit --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "No drift detected in the latest audit — closing. Re-opens automatically if drift returns."
            gh issue close "$existing"
          fi
          echo "No drift."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-audit-report
          path: |
            /tmp/report.md
            /tmp/report.json
          if-no-files-found: warn
