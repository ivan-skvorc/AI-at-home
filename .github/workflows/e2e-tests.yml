name: E2E Tests

on:
  push:
    branches: [ 'main', '2.0.x-dev' ]
    paths:
      - 'frontend/**'
      - '.github/workflows/e2e-tests.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'frontend/**'
      - '.github/workflows/e2e-tests.yml'

concurrency:
  group: e2e-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-tests:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - name: Use pinned pnpm version
        # corepack downloads the pinned pnpm from the npm registry here. A
        # transient abort mid-download does not surface as a network error: it
        # crashes Node's bundled undici parser with an opaque
        # `AssertionError: assert(!this.paused)`, the job dies before a single
        # test runs, and the log reads like a Node bug rather than a hiccup.
        # Seen on PR #106, where a sibling job downloaded the same tarball
        # successfully in the same run. Retry rather than re-running the job by
        # hand — nothing else in this step can fail, so a retry can only be
        # recovering the download.
        run: |
          for attempt in 1 2 3; do
            if corepack prepare pnpm@10.26.2 --activate; then
              exit 0
            fi
            echo "::warning::corepack prepare failed (attempt ${attempt}/3); retrying" >&2
            sleep $((attempt * 5))
          done
          exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        working-directory: frontend
        run: pnpm exec playwright test
        env:
          SKIP_ENV_VALIDATION: '1'

      - name: Run auth recovery E2E tests
        working-directory: frontend
        run: pnpm exec playwright test -c playwright.auth.config.ts
        env:
          SKIP_ENV_VALIDATION: '1'

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
