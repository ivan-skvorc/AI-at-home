[project]
name = "deerflow-extension-cad-preview"
version = "0.1.0"
description = "Rotatable GLB and STL previews for DeerFlow artifact panels"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["THIRD_PARTY_NOTICES.md"]
dependencies = ["deerflow-extension-api>=0.2.3,<0.3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.15"]

[project.entry-points."deerflow.extensions"]
cad_preview = "deerflow_extension_cad_preview:install"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deerflow_extension_cad_preview"]

[tool.uv]
# Rebuild the installed copy when any packaged file changes, not only
# pyproject.toml (uv's default): DeerFlow bundles this extension as a snapshot
# that `git pull` updates in place, and a stale build would keep old bundles.
cache-keys = [{ file = "pyproject.toml" }, { file = "deerflow_extension_cad_preview/**/*" }]
